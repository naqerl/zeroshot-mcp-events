name: Release

# Tag push is the release trigger: the tag names the image, so gitops pins a
# readable version instead of a digest nobody can map back to a commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=zeroshot-mcp-events
            org.opencontainers.image.description=Bridge Zeroshot Platform run events to ntfy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ZEROSHOT_VERSION=latest

      # A private package cannot be pulled by the cluster, and a package created
      # while the repository was private stays private. The workflow token is
      # the one credential that may change that, so try it on every release and
      # keep the result visible in the run summary.
      - name: Make the package pullable
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${GITHUB_REPOSITORY,,}"
          pkg="${pkg#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          code=$(curl -sS -o /tmp/visibility.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/users/$owner/packages/container/$pkg")
          echo "package visibility PATCH -> $code"
          cat /tmp/visibility.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::could not set ghcr.io/$owner/$pkg to public (HTTP $code); if it stays private the cluster needs an imagePullSecret"
          fi

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "zeroshot-mcp-events version: $(node -p "require('./package.json').version")"
          } >> "$GITHUB_STEP_SUMMARY"
