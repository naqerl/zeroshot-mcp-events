name: pkg-reset
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "delete every version of the package (then re-tag to recreate it public)"
        default: "no"
permissions:
  contents: read
  packages: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -sS -o /tmp/v.json -w 'list -> %{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/naqerl/packages/container/zeroshot-mcp-events/versions
          head -c 600 /tmp/v.json; echo
          if [ "${{ inputs.apply }}" = "yes" ]; then
            for id in $(node -e 'const j=require("/tmp/v.json");console.log((j||[]).map(v=>v.id).join(" "))' 2>/dev/null); do
              curl -sS -o /dev/null -w "delete $id -> %{http_code}\n" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/naqerl/packages/container/zeroshot-mcp-events/versions/$id"
            done
          fi
